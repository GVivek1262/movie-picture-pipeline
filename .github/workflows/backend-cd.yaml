name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'starter/backend/.python-version'
          cache: 'pipenv'
          cache-dependency-path: 'starter/backend/Pipfile.lock'

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'starter/backend/.python-version'
          cache: 'pipenv'
          cache-dependency-path: 'starter/backend/Pipfile.lock'

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build --tag mp-backend:latest .

      - name: Tag Docker image
        run: |
          docker tag mp-backend:latest \
            ${{ steps.login-ecr.outputs.registry }}/mp-backend:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/mp-backend:latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube

          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config

          clusters:
          - cluster:
              certificate-authority-data: ${EKS_CA_DATA}
              server: ${EKS_CLUSTER_ENDPOINT}
            name: serious-bluegrass-crow

          contexts:
          - context:
              cluster: serious-bluegrass-crow
              user: github-actions-user
            name: serious-bluegrass-crow

          current-context: serious-bluegrass-crow

          users:
          - name: github-actions-user
            user:
              exec:
                apiVersion: client.authentication.k8s.io/v1beta1
                args:
                - --region
                - us-east-1
                - eks
                - get-token
                - --cluster-name
                - serious-bluegrass-crow
                - --output
                - json
                command: aws
          EOF

          chmod 600 ~/.kube/config

        env:
          EKS_CA_DATA: ${{ secrets.EKS_CA_DATA }}
          EKS_CLUSTER_ENDPOINT: ${{ secrets.EKS_CLUSTER_ENDPOINT }}

      - name: Verify Kubernetes access
        run: |
          kubectl get nodes

      - name: Deploy backend to Kubernetes
        run: |
          kubectl delete deployment backend --ignore-not-found
          kubectl apply -k starter/backend/k8s

      - name: Update backend image
        run: |
          kubectl set image deployment/backend \
            backend=${{ steps.login-ecr.outputs.registry }}/mp-backend:latest

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/backend --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get svc backend